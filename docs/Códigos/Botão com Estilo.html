<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Botão Estiloso</title>
  <style>
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <button>Clique Aqui</button>
</body>
</html>
