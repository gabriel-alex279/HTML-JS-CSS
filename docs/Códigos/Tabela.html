<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tabela Simples</title>
</head>
<body>
  <h1>Notas dos Estudantes</h1>
  <table border="1">
    <tr>
      <th>Nome</th>
      <th>Nota</th>
    </tr>
    <tr>
      <td>Augusto</td>
      <td>7.9</td>
    </tr>
    <tr>
      <td>Fernanda</td>
      <td>8.7</td>
    </tr>
  </table>
</body>
</html>
