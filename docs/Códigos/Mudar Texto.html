<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Texto Interativo</title>
</head>
<body>
  <h1 id="titulo">Texto original</h1>
  <button onclick="mudarTexto()">Alterar o texto</button>

  <script>
    function mudarTexto() {
      document.getElementById("titulo").innerText = "Você mudou o texto.";
    }
  </script>
</body>
</html>
