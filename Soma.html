<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Soma</title>
</head>
<body>
  <h1>Somar Números</h1>

  <input id="a" type="number"> +
  <input id="b" type="number">
  <button onclick="soma()">=</button>

  <span id="res"></span>

  <script>
    function soma() {
      res.innerText = Number(a.value) + Number(b.value);
    }
  </script>
</body>
</html>
